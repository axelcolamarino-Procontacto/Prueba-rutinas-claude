<!DOCTYPE html>
<html lang="es">
<head>

<title>Cortex — QA Agent Brain</title>
<style>

  body { background:#060c1a; color:#c8d8f0; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; height:100vh; }

    display:flex; align-items:center; justify-content:center; flex-direction:column;
    color:#5a7a98; font-size:13px; letter-spacing:.5px; }

  /* Topbar */
  #topbar {
    position:absolute; top:0; left:0; right:0; height:56px;

  #demo-tag { margin-left:auto; font-size:11px; color:#ffa040;

  /* Leyenda */
  #legend { position:absolute; bottom:24px; left:18px;

  #legend h4 { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#3a5060; margin-bottom:10px; }

  .li:hover { color:#9ab8d0; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 5px currentColor; }

  /* Tooltip leyenda */
  #legend-tooltip { display:none; position:fixed; z-index:99999;
    background:rgba(4,9,20,0.97); border:1px solid rgba(100,150,255,0.35);
    border-radius:10px; padding:14px 18px; width:260px; font-size:12px;
    color:#c8d8f0; pointer-events:none; line-height:1.7;
    box-shadow:0 8px 32px rgba(0,0,0,0.7); }

  /* Minimap */
  #minimap { position:absolute; bottom:24px; right:18px; z-index:100;
    width:220px; height:160px; background:rgba(4,9,20,0.88); backdrop-filter:blur(8px);

  #minimap:hover { border-color:rgba(100,150,255,0.4); }

  /* Panel detalle */
  #detail { position:absolute; top:68px; right:18px; width:280px;
    background:rgba(6,12,26,0.92); backdrop-filter:blur(14px);

  #detail.show { display:block; }
  #detail h3 { font-size:13px; color:#c8d8f0; margin-bottom:3px; word-break:break-word; padding-right:18px; }
  #dtype { font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
  .drow { display:flex; justify-content:space-between; gap:10px; font-size:11px; color:#607888;

  /* ── Pestaña Costos ──────────────────────────────────────────────────────── */

  .vt { padding:1px 7px; border-radius:10px; font-size:9.5px; font-weight:700; }

  .usd { color:#b8e0c8; } .usd.total { color:#66ffa6; font-weight:700; }
  .cost-empty { color:#5a7a98; font-size:13px; padding:44px; text-align:center; line-height:1.8; }

<div id="graph-2d"></div>

<div id="costs-view">

<script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
<script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
// CORTEX — QA Agent Brain Visualizer
// Capas: Proyecto → Módulo (ring pulsante por salud) → Submódulo → Bug → Skill
// ════════════════════════════════════════════════════════════════════════════

const BACKEND = 'http://localhost:8001'   // server.py (BigQuery en vivo)

// ── Colores por tipo ──────────────────────────────────────────────────────────
const COLORS = {
  project:'#ffffff', module:'#26c6da', generic:'#607d8b',
  bug:'#ef5350', skill:'#e040fb',
  sf_field:'#4fc3f7', sf_profile:'#ab47bc', root_cause:'#ff7043',
  condition:'#ec407a', flow:'#29b6f6', test_case:'#ffa726'
}
const TYPE_LABEL = {
  project:'Proyecto', module:'Módulo', generic:'Submódulo / Entidad',
  bug:'Bug conocido', skill:'Skill aprendido',
  sf_field:'Campo Salesforce', sf_profile:'Perfil / Usuario', root_cause:'Root Cause',
  condition:'Condición / Dynamic Forms', flow:'Flow / Trigger', test_case:'Test Case'
}

// ── Tamaños ───────────────────────────────────────────────────────────────────
// 3D: val = volumen de la esfera.  2D: radio en px directo.
function val3D(t)   { return t==='project'?27 : t==='module'?8 : t==='skill'?3 : t==='bug'?2 : 1 }
function radius2D(t){ return t==='project'?18 : t==='module'?9 : t==='skill'?5 : t==='bug'?3 : 4 }

// ── Color de salud de un módulo según failure_rate ────────────────────────────
function healthColor(fr) {
  if (fr === undefined || fr === null || fr < 0) return null   // sin datos
  if (fr >= 0.5)  return '255,82,82'    // rojo
  if (fr >= 0.25) return '255,179,0'    // ámbar
  if (fr > 0)     return '102,187,106'  // verde
  return null                            // cero fallos = sin ring de alerta
}

// Color de un nodo en 3D. Para módulos con salud, interpola cyan↔color de salud
// según `pulse` (0..1) para lograr el efecto pulsante.
function node3DColor(n, pulse) {
  if (n.type !== 'module') return COLORS[n.type] || COLORS.generic
  const h = healthColor(n.failure_rate_pct)
  if (!h) return COLORS.module                       // sin datos → cyan fijo
  const [hr,hg,hb] = h.split(',').map(Number)
  const cr=38, cg=198, cb=218                         // cyan base
  const t = 0.30 + 0.55*pulse                         // mezcla 0.30 → 0.85
  return `rgb(${Math.round(cr+(hr-cr)*t)},${Math.round(cg+(hg-cg)*t)},${Math.round(cb+(hb-cb)*t)})`
}

// ── Estado ──────────────────────────────────────────────────────────────────
const DEMO = {
  nodes:[
    {id:'CMIV2',name:'CMIV2',type:'project',project:'CMIV2'},
    {id:'SOLO', name:'SOLO', type:'project',project:'SOLO'},
    {id:'Oportunidades',name:'Oportunidades',type:'module',project:'CMIV2',failure_rate_pct:0.58},
    {id:'Gestión de Visitas',name:'Gestión de Visitas',type:'module',project:'CMIV2',failure_rate_pct:0.14},
    {id:'Pagos',name:'Pagos',type:'module',project:'SOLO',failure_rate_pct:0.25},
    {id:'sub1',name:'Backoffice - Tareas',type:'generic',project:'CMIV2'},
    {id:'sub2',name:'Visit Template',type:'generic',project:'CMIV2'},
    {id:'bug1',name:'Campo Email no visible para Sales',type:'bug',project:'CMIV2'},
    {id:'skill:demo',name:'Dynamic Forms Check',type:'skill',project:'CMIV2',success_rate:0.95,use_count:7}
  ],
  links:[
    {source:'CMIV2',target:'Oportunidades',relation:'contains_module',value:1},
    {source:'CMIV2',target:'Gestión de Visitas',relation:'contains_module',value:1},
    {source:'SOLO', target:'Pagos',relation:'contains_module',value:1},
    {source:'Gestión de Visitas',target:'sub1',relation:'has_submodule',value:.9},
    {source:'Gestión de Visitas',target:'sub2',relation:'has_submodule',value:.9},
    {source:'Oportunidades',target:'bug1',relation:'has_open_bug',value:.9},
    {source:'skill:demo',target:'Gestión de Visitas',relation:'covers',value:.95}
  ]
}

let gData     = DEMO
let gFiltered = DEMO
let Graph2    = null
let activeTab = '2d'
let costsData = null, costsExpanded = new Set(), _costsTimer = null, costMonth = 'current'
const _costsByMonth = {}   // caché mes -> payload; cambiar de mes ya visto = instantáneo
function onMonthChange(v){ costMonth = v; loadCosts() }
function fillMonthSelect(months, selected){
  const sel = document.getElementById('cost-month'); if(!sel) return
  const monthLbl = m => { const [y,mm]=m.split('-'); const N=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return `${N[+mm]} ${y}` }
  const opts = ['<option value="all">Todo (histórico)</option>']
    .concat((months||[]).map(m => `<option value="${m}">${monthLbl(m)}</option>`))
  sel.innerHTML = opts.join('')
  // el backend resolvió 'current' al mes real -> reflejarlo en el <select>
  sel.value = (selected && selected!=='all') ? selected : (costMonth==='all' ? 'all' : (months&&months[0]||'all'))
}

// Capas activas — cerebro completo. Mostramos TODO lo que curó el backend (estructura + skills +
// conocimiento libre + tracks); solo ocultamos relaciones de PURA métrica (no son entidades del grafo).
const HIDDEN_RELATIONS = new Set(['failure_rate','tested_in_module','has_failed_tc_count','has_label',
  'confidence_score','validation_result','execution_result','verification_result'])

// ── Filtrado por proyecto ──────────────────────────────────────────────────
function computeFiltered() {
  const proj = document.getElementById('project-filter')?.value || 'ALL'
  let links = gData.links.filter(l => !HIDDEN_RELATIONS.has(l.relation))

  if (proj !== 'ALL') {
    const inProj = new Set(gData.nodes.filter(n => n.project === proj).map(n => n.id))
    links = links.filter(l => inProj.has(l.source?.id||l.source) || inProj.has(l.target?.id||l.target))
  }

  const ids = new Set()
  links.forEach(l => { ids.add(l.source?.id||l.source); ids.add(l.target?.id||l.target) })
  // incluí también los nodos de PROYECTO aunque no tengan links (proyectos sin KG aún) cuando se ven todos
  let nodes = gData.nodes.filter(n => ids.has(n.id) || (proj==='ALL' && (n.type==='project' || n.type==='skill')))
  if (proj !== 'ALL') nodes = nodes.filter(n => n.project === proj || n.type === 'project')

  // Podar links huérfanos: al filtrar por proyecto, un link puede sobrevivir por UN extremo (línea 298)
  // pero el nodo del OTRO extremo (ej. un módulo de otro proyecto) se descarta -> link colgado ->
  // ForceGraph tira "node not found". Dejamos solo los links con AMBOS extremos en el set final.
  const keep = new Set(nodes.map(n => n.id))
  links = links.filter(l => keep.has(l.source?.id||l.source) && keep.has(l.target?.id||l.target))

  return { nodes, links }
}

// ── Render ──────────────────────────────────────────────────────────────────
function radialLayout(nodes, links){
  // Layout RADIAL JERÁRQUICO determinístico (fx/fy fijos): skills GLOBAL en círculo CENTRAL ->
  // proyectos en círculo EXTERNO -> submódulos en anillo alrededor de cada proyecto -> bugs en
  // anillo alrededor de cada submódulo. Lo que no entre en la jerarquía lo ubica la física.
  const byId = new Map(nodes.map(n => [n.id, n]));
  const isSkill = n => String(n.id).startsWith('skill:');
  const allSkills = nodes.filter(isSkill);
  const skills     = allSkills.filter(s => !s.project || s.project === 'GLOBAL');     // GLOBALES -> anillo CENTRAL + estrella
  const projSkills = allSkills.filter(s => s.project && s.project !== 'GLOBAL');      // ESPECÍFICAS -> orbitan SU proyecto (halo)
  const projects = nodes.filter(n => n.type === 'project' && n.id !== 'GLOBAL');   // GLOBAL = hub central, no va en el círculo
  nodes.forEach(n => { delete n.fx; delete n.fy; });

  // adyacencia padre -> hijos (excluye 'covers' de skills para no contaminar la jerarquía)
  const kids = new Map();
  for (const l of links){
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (l.relation === 'covers') continue;
    if (String(s).startsWith('skill:') || String(t).startsWith('skill:')) continue;
    if (!kids.has(s)) kids.set(s, []);
    kids.get(s).push(t);
  }
  const visited = new Set();

  // 1) skills GLOBAL: círculo central (acceso ordenado de todos los proyectos)
  const Rs = Math.max(140, skills.length * 11);
  skills.forEach((s, i) => {
    const a = 2*Math.PI*i / Math.max(1, skills.length);
    s.fx = Math.round(Rs*Math.cos(a)); s.fy = Math.round(Rs*Math.sin(a)); visited.add(s.id);
  });

  // hub GLOBAL en el CENTRO: las skills globales cuelgan de acá (spokes limpios), no de todos los proyectos
  const _gh = byId.get('GLOBAL');
  if (_gh) { _gh.fx = 0; _gh.fy = 0; visited.add('GLOBAL'); }

  // recursivo: ubica un nodo y reparte sus hijos.
  //  - level 0 (módulos alrededor del proyecto): CÍRCULO completo.
  //  - level >=1 (submódulos/bugs): ABANICO hacia afuera (opuesto al padre-del-padre) -> el cluster
  //    de cada módulo queda de su lado, sin pisar el centro ni a los módulos vecinos. El radio CRECE
  //    con la cantidad de hijos para que no se amontonen los módulos con muchos submódulos.
  function place(node, x, y, level, px, py){
    node.fx = Math.round(x); node.fy = Math.round(y); visited.add(node.id);
    if (level >= 4) return;   // techo alto: prácticamente todo queda fijado (nada flota al centro)
    const ch = [...new Set(kids.get(node.id) || [])].map(id => byId.get(id)).filter(c => c && !visited.has(c.id));
    if (!ch.length) return;
    if (level === 0){
      // ordenar módulos para que los de MUCHOS submódulos queden SEPARADOS en el círculo
      // (intercalado grande/chico) -> sus abanicos divergen en vez de superponerse.
      const kc = id => (kids.get(id) || []).length;
      const sorted = ch.slice().sort((a, b) => kc(b.id) - kc(a.id));
      const arr = []; let lo = 0, hi = sorted.length - 1;
      for (let i = 0; i < sorted.length; i++) arr.push(i % 2 === 0 ? sorted[lo++] : sorted[hi--]);
      const r = Math.min(640, Math.max(240, arr.length*26));
      arr.forEach((c, j) => { const a = 2*Math.PI*j/arr.length - Math.PI/2; place(c, x + r*Math.cos(a), y + r*Math.sin(a), 1, x, y); });
    } else {
      const outward = Math.atan2(y - py, x - px);              // dirección "hacia afuera" del módulo
      const r = Math.max(level === 1 ? 160 : 85, ch.length*7); // crece con #hijos -> no se amontonan
      const span = ch.length === 1 ? 0 : Math.min(Math.PI*1.5, ch.length*0.32);
      ch.forEach((c, j) => {
        const a = ch.length === 1 ? outward : (outward - span/2 + span*j/(ch.length-1));
        place(c, x + r*Math.cos(a), y + r*Math.sin(a), level+1, x, y);
      });
    }
  }

  if (projects.length < 2){
    if (projects.length) place(projects[0], 0, 0, 0, 0, 0);
  } else {
    const R1 = Math.max(3000, projects.length * 460);   // círculo externo (amplio: clusters grandes no se solapan)
    projects.forEach((p, i) => {
      const ang = 2*Math.PI*i/projects.length - Math.PI/2;
      place(p, R1*Math.cos(ang), R1*Math.sin(ang), 0, 0, 0);
    });
  }
  // skills ESPECÍFICAS de proyecto: orbitan el nodo de SU proyecto (halo interno), NO el anillo central
  const _bp = {};
  projSkills.forEach(s => { (_bp[s.project] = _bp[s.project] || []).push(s); });
  for (const pid in _bp){
    const pn = byId.get(pid);
    if (!pn || pn.fx == null) continue;
    const sks = _bp[pid], rr = 175;
    sks.forEach((s, j) => {
      const a = 2*Math.PI*j/sks.length + 0.4;
      s.fx = Math.round(pn.fx + rr*Math.cos(a)); s.fy = Math.round(pn.fy + rr*Math.sin(a)); visited.add(s.id);
    });
  }

  // FALLBACK determinístico: los nodos que la jerarquía NO ubicó (p.ej. free-knowledge con anclaje débil,
  // "Operador Logístico" y similares) hay que FIJARLOS igual — si quedan sin fx/fy la física los DISPARA
  // lejos del cluster. Los anclamos junto a sus vecinos ya ubicados (promedio + offset áureo para no
  // apilarlos); si no tienen ninguno ubicado, van a un anillo externo determinístico.
  const adj = new Map();
  for (const l of links){
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (!adj.has(s)) adj.set(s, []); adj.get(s).push(t);
    if (!adj.has(t)) adj.set(t, []); adj.get(t).push(s);
  }
  const unplaced = nodes.filter(n => n.fx == null || n.fy == null);
  unplaced.forEach((n, idx) => {
    const a = idx * 2.399963229;   // ángulo áureo -> reparto parejo, sin apilar
    // Anclar SOLO a vecinos ubicados que NO sean skills ni el hub GLOBAL: los skills forman un anillo
    // SIMÉTRICO alrededor del centro, así que el promedio de varias skills cae en (0,0) -> un nodo
    // cubierto (covers) por varias skills globales aterrizaría en el MEDIO del anillo. Ancla a
    // módulos/proyectos reales; si no tiene ninguno (solo lo cubren skills), va al anillo externo.
    const anchors = (adj.get(n.id) || []).map(id => byId.get(id))
      .filter(m => m && m.fx != null && !unplaced.includes(m) && !isSkill(m) && m.id !== 'GLOBAL');
    if (anchors.length){
      let sx = 0, sy = 0; anchors.forEach(m => { sx += m.fx; sy += m.fy; });
      n.fx = Math.round(sx/anchors.length + 45*Math.cos(a));
      n.fy = Math.round(sy/anchors.length + 45*Math.sin(a));
    } else {
      const R = 900;   // sin ancla real -> anillo externo determinístico, NUNCA el centro
      n.fx = Math.round(R*Math.cos(a)); n.fy = Math.round(R*Math.sin(a));
    }
    visited.add(n.id);
  });
  return nodes;
}

function render() {
  gFiltered = computeFiltered()
  const _nodes = gFiltered.nodes.map(n=>({...n}))
  const _links = gFiltered.links.map(l=>({...l}))
  // radialLayout fija fx/fy de TODOS los nodos (jerarquía + fallback determinístico). Con posiciones
  // fijas la simulación no mueve nada -> grafo determinista y estático: no deriva ni dispara nodos.
  radialLayout(_nodes, _links)
  if (!Graph2) { initGraph2D(); }
  Graph2._fit = false                                  // datos nuevos -> permitir un encuadre
  Graph2.graphData({ nodes: _nodes, links: _links })
  // posiciones fijas => un setTimeout es seguro (los nodos NO se mueven); onEngineStop lo respalda
  setTimeout(() => { if (!Graph2._fit) { Graph2._fit = true; Graph2.zoomToFit(600, 70) } }, 600)
  updateStats()
  startMinimap()
}

function updateStats() {
  document.getElementById('sn').textContent = gFiltered.nodes.length
  document.getElementById('sl').textContent = gFiltered.links.length
  document.getElementById('ss').textContent = gFiltered.nodes.filter(n=>n.type==='skill').length
}

function switchTab(tab) {
  activeTab = tab
  const isCosts = tab==='costos'
  document.getElementById('graph-2d').style.display = isCosts?'none':'block'
  document.getElementById('costs-view').classList.toggle('show', isCosts)
  document.getElementById('tab-2d').classList.toggle('active', tab==='2d')
  document.getElementById('tab-costos').classList.toggle('active', isCosts)
  // chrome del grafo (leyenda/minimap) molesta sobre la vista de costos → ocultar ahí
  ;['legend','minimap'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display = isCosts?'none':'' })
  closeD()
  if (isCosts) {
    loadCosts()
    if (!_costsTimer) _costsTimer = setInterval(()=>{ if(activeTab==='costos') loadCosts(true) }, 30000)  // auto-refresh (fuerza red)
    return
  }
  if (_costsTimer) { clearInterval(_costsTimer); _costsTimer = null }
  // Si el grafo ya existe, solo mostrarlo (no re-renderizar para no perder posiciones)
  if (Graph2) { startMinimap(); return }
  render()
}

// ── Costos: carga + render de tabla dinámica (auto-refresh cada 30s) ──────────
function fmtUSD(v){ return (v==null) ? '—' : '$'+Number(v).toFixed(Math.abs(v)<1?4:2) }

function _applyCosts(d){
  costsData = d
  if(d && d.ok) fillMonthSelect(d.months, d.selected_month)
  renderCosts()
}
// force=true (auto-refresh) -> siempre pega a la red, sin spinner, deja la tabla visible.
// force=false (cambio de mes / primer load) -> usa caché si existe (instantáneo); si no, spinner + red.
async function loadCosts(force){
  const body=document.getElementById('cost-body')
  const cached = _costsByMonth[costMonth]
  if(cached && !force){                 // mes ya visto -> mostrarlo YA, sin esperar la red
    _applyCosts(cached); loadDeepseekBalance(); return
  }
  if(!cached){                          // no hay datos para este mes -> spinner (también al cambiar de mes)
    body.innerHTML = `<div class="cost-empty"><div class="cost-spinner"></div>Cargando costos…</div>`
    document.getElementById('cost-grand').textContent='…'
    document.getElementById('cost-runs').textContent='…'
    document.getElementById('cost-refresh').textContent='cargando…'
  }
  const reqMonth = costMonth            // capturamos: el usuario puede cambiar de mes mientras carga
  try {
    const d = await tryFetch(`${BACKEND}/api/costs?limit=500&month=${encodeURIComponent(reqMonth)}`, 20000)
    _costsByMonth[reqMonth] = d
    if(d && d.ok && d.selected_month) _costsByMonth[d.selected_month] = d   // 'current' resuelve a 'YYYY-MM'
    if(reqMonth !== costMonth) return   // ya cambió de mes -> no pisar la vista actual
    _applyCosts(d)
    document.getElementById('cost-refresh').textContent = (d&&d.ok?'✓ ':'⚠ ') + new Date().toLocaleTimeString()
  } catch(e){
    if(reqMonth !== costMonth) return
    document.getElementById('cost-refresh').textContent = '✗ sin backend'
    if(!costsData){ costsData = {ok:false}; renderCosts() }
  }
  loadDeepseekBalance()
}

async function loadDeepseekBalance(){
  const el=document.getElementById('ds-balance'), kpi=document.getElementById('ds-kpi')
  if(!el) return
  try {
    const d = await tryFetch(`${BACKEND}/api/deepseek-balance`, 15000)
    if(d && d.ok){
      const bal = Number(d.total_balance)
      el.textContent = '$'+bal.toFixed(2)
      kpi.title = `DeepSeek restante: $${bal.toFixed(2)} ${d.currency} `
        + `(otorgado $${Number(d.granted_balance).toFixed(2)} + recargado $${Number(d.topped_up_balance).toFixed(2)})`
        + (d.is_available ? '' : ' — ⚠ CUENTA NO DISPONIBLE')
      el.style.color = (!d.is_available || bal < 5) ? '#ff6b6b' : (bal < 20 ? '#ffd166' : '#34d399')
    } else {
      el.textContent='—'; el.style.color=''; kpi.title='No se pudo leer el balance: ' + ((d&&d.error)||'sin backend')
    }
  } catch(e){ el.textContent='—'; el.style.color=''; kpi.title='No se pudo leer el balance de DeepSeek' }
}

function execTable(rows, showProj){
  if(!rows.length) return `<div class="cost-empty">Sin ejecuciones.</div>`
  let h = `<table class="cost-tbl"><thead><tr><th class="l">Issue</th>${showProj?'<th class="l">Proy</th>':''}`
        + `<th class="l">Plat</th><th class="l">Verdict</th><th>Dur</th><th>Calls</th><th>DeepSeek</th><th>Cloud Run</th><th>Total</th><th class="l">Fecha</th></tr></thead><tbody>`
  for(const e of rows){
    const v=(e.verdict||'').toUpperCase()
    h += `<tr><td class="l" style="color:#cfe2ff">${e.issue||'—'}</td>${showProj?`<td class="l">${e.project||''}</td>`:''}`
       + `<td class="l">${e.platform||''}</td><td class="l">${v?`<span class="vt ${v}">${v}</span>`:'—'}</td>`
       + `<td>${e.duration_s?Math.round(e.duration_s)+'s':'—'}</td><td>${e.deepseek_calls??'—'}</td>`
       + `<td class="usd">${fmtUSD(e.deepseek_usd)}</td><td class="usd">${fmtUSD(e.cloudrun_usd)}</td>`
       + `<td class="usd total">${fmtUSD(e.total_usd)}</td><td class="l">${e.ts?new Date(e.ts).toLocaleString():'—'}</td></tr>`
  }
  return h+`</tbody></table>`
}

function renderCosts(){
  const body=document.getElementById('cost-body'), grand=document.getElementById('cost-grand'), runs=document.getElementById('cost-runs')
  if(!costsData || !costsData.ok){
    grand.textContent='$0'; runs.textContent='0'
    body.innerHTML = `<div class="cost-empty">Aún no hay datos de costos.<br>Se llenan a medida que el runner ejecuta issues — el agente escribe una fila por ejecución en <code>qa_agent.run_costs</code>.</div>`
    return
  }
  grand.textContent = fmtUSD(costsData.grand_total_usd)
  runs.textContent  = costsData.total_runs||0
  const q=(document.getElementById('cost-search').value||'').trim().toUpperCase()

  if(q){   // modo búsqueda: ejecuciones cuyo issue matchea
    const rows=(costsData.executions||[]).filter(e=>(e.issue||'').toUpperCase().includes(q))
    body.innerHTML = `<div style="font-size:11px;color:#6a8aa8;margin-bottom:8px">${rows.length} ejecución(es) para "${q}"</div>` + execTable(rows,true)
    return
  }
  // modo agregado por proyecto (comparación), expandible a ejecuciones
  let html = `<table class="cost-tbl"><thead><tr><th class="l">Proyecto</th><th>Runs</th>`
    + `<th>DeepSeek</th><th>Cloud Run</th><th>Gemini</th><th>BQ</th><th>VM</th><th>$/run</th><th>Total</th><th class="l">Último</th></tr></thead><tbody>`
  for(const p of (costsData.by_project||[])){
    const open=costsExpanded.has(p.project)
    html += `<tr class="proj-row" onclick="toggleProj('${p.project}')"><td class="l proj-name">`
      + `<span class="caret" style="transform:rotate(${open?90:0}deg)">▶</span> ${p.project}</td>`
      + `<td>${p.runs}</td><td class="usd">${fmtUSD(p.deepseek_usd)}</td><td class="usd">${fmtUSD(p.cloudrun_usd)}</td>`
      + `<td class="usd">${fmtUSD(p.gemini_usd)}</td><td class="usd">${fmtUSD(p.bigquery_usd)}</td><td class="usd">${fmtUSD(p.vm_usd)}</td>`
      + `<td class="usd">${fmtUSD(p.avg_usd)}</td><td class="usd total">${fmtUSD(p.total_usd)}</td>`
      + `<td class="l">${p.last_run?new Date(p.last_run).toLocaleString():'—'}</td></tr>`
    if(open){
      const ex=(costsData.executions||[]).filter(e=>e.project===p.project)
      html += `<tr class="exec-row"><td colspan="10">${execTable(ex,false)}</td></tr>`
    }
  }
  html += `</tbody></table>`
  body.innerHTML = (costsData.by_project&&costsData.by_project.length) ? html
    : `<div class="cost-empty">Aún no hay datos de costos. Se llenan a medida que el runner ejecuta issues.</div>`
}

function toggleProj(p){ costsExpanded.has(p)?costsExpanded.delete(p):costsExpanded.add(p); renderCosts() }

// ── Init 2D ───────────────────────────────────────────────────────────────────
function initGraph2D() {
  Graph2 = ForceGraph()(document.getElementById('graph-2d'))
    .backgroundColor('#060c1a')
    .nodeLabel(n => n.name || n.id)
    .nodeVal(n => val3D(n.type))
    .nodeCanvasObjectMode(()=> 'replace')
    .nodeCanvasObject((node, ctx, scale) => {
      const t = node.type
      const r = radius2D(t)
      const color = COLORS[t] || COLORS.generic
      const now = Date.now()

      // glow base
      ctx.beginPath(); ctx.arc(node.x,node.y,r+3,0,2*Math.PI)
      ctx.fillStyle = (t==='project') ? 'rgba(255,255,255,0.12)'
                    : (t==='bug') ? 'rgba(239,83,80,0.14)'
                    : color+'22'
      ctx.fill()

      // círculo
      ctx.beginPath(); ctx.arc(node.x,node.y,r,0,2*Math.PI); ctx.fillStyle=color; ctx.fill()

      // ── proyecto: ring blanco fijo ──
      if (t==='project') {
        ctx.beginPath(); ctx.arc(node.x,node.y,r+3,0,2*Math.PI)
        ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5; ctx.stroke()
      }

      // ── módulo: ring PULSANTE según salud ──
      if (t==='module') {
        const h = healthColor(node.failure_rate_pct)
        if (h) {
          const pulse = (Math.sin(now*0.0025)+1)/2
          const expand = (h==='255,82,82'?4 : h==='255,179,0'?3 : 2)
          const alpha  = 0.30 + 0.35*pulse
          const rr = r + 2 + expand*pulse
          ctx.beginPath(); ctx.arc(node.x,node.y,rr+2,0,2*Math.PI)
          ctx.strokeStyle=`rgba(${h},${alpha*0.4})`; ctx.lineWidth=4; ctx.stroke()
          ctx.beginPath(); ctx.arc(node.x,node.y,rr,0,2*Math.PI)
          ctx.strokeStyle=`rgba(${h},${alpha})`; ctx.lineWidth=1.5; ctx.stroke()
        } else {
          ctx.beginPath(); ctx.arc(node.x,node.y,r+2,0,2*Math.PI)
          ctx.strokeStyle='rgba(38,198,218,0.4)'; ctx.lineWidth=1; ctx.stroke()
        }
      }

      // ── skill: ring dorado rotante ──
      if (t==='skill') {
        ctx.save(); ctx.translate(node.x,node.y); ctx.rotate((now*0.001)%(2*Math.PI))
        ctx.beginPath(); ctx.arc(0,0,r+4,0,2*Math.PI)
        ctx.setLineDash([r*0.9, r*0.5]); ctx.strokeStyle='rgba(224,64,251,0.85)'; ctx.lineWidth=1.5; ctx.stroke()
        ctx.setLineDash([]); ctx.restore()
      }

      // ── etiquetas ──
      const labelsOn = document.getElementById('labels-toggle')?.checked
      const show = t==='project'
                || (t==='module' && scale>=0.5)
                || (t==='skill'  && scale>=0.9)
                || (t==='bug'    && scale>=2.0)
                || (labelsOn && scale>=1.0)
                || (scale>=3.5)
      if (show) {
        const raw = node.name || node.id
        const label = raw.length>30 ? raw.slice(0,28)+'…' : raw
        const fs = Math.max(6, (t==='project'?13:10)/scale)
        ctx.font = `${fs}px Segoe UI, sans-serif`
        ctx.textAlign='center'; ctx.textBaseline='top'
        ctx.fillStyle = t==='project' ? 'rgba(255,255,255,0.95)' : 'rgba(170,200,235,0.85)'
        ctx.fillText(label, node.x, node.y+r+2)
      }
    })
    .linkColor(l => l.relation==='covers' ? 'rgba(224,64,251,0.15)' : `rgba(120,170,255,${Math.max(0.2,(l.value||0.5)*0.5)})`)
    .linkWidth(l => l.relation==='covers' ? 0.5 : Math.max(0.5,(l.value||0.5)*1.3))
    .linkDirectionalParticles(l => (l.relation!=='covers' && l.value>0.85)?2:0)
    .linkDirectionalParticleWidth(1.6)
    .linkDirectionalParticleColor(()=> 'rgba(79,195,247,0.9)')
    .linkLabel(l => l.relation||'')
    .onNodeClick(showDetail)
    .onBackgroundClick(closeD)

  Graph2.d3Force('charge').strength(n => n.type==='project' ? -1000 : -220).distanceMax(900)
  Graph2.d3Force('link').distance(l =>
    l.relation==='covers'?150 : l.relation==='has_open_bug'?85 : l.relation==='has_submodule'?55 : 50)
    .strength(l => l.relation==='covers' ? 0.02 : 0.5)
  Graph2.d3VelocityDecay(0.4)
  Graph2.cooldownTime(4000)
  // Encuadre de respaldo: las posiciones ya vienen FIJAS desde render() (fx/fy), así que la
  // simulación se detiene enseguida sin mover nada -> el encuadre queda estable, no deriva.
  Graph2.onEngineStop(()=>{ if (!Graph2._fit) { Graph2._fit = true; Graph2.zoomToFit(600, 70) } })
}

// ── Panel de detalle ──────────────────────────────────────────────────────────
function showDetail(node) {
  const p = document.getElementById('detail'); p.classList.add('show')
  document.getElementById('dname').textContent = node.name || node.id
  const te = document.getElementById('dtype')
  te.textContent = TYPE_LABEL[node.type] || node.type
  te.style.color = COLORS[node.type] || COLORS.generic

  const meta = []
  meta.push(['Tipo', TYPE_LABEL[node.type] || node.type])
  if (node.project) meta.push(['Proyecto', node.project])
  if (node.type==='module' && node.failure_rate_pct >= 0)
    meta.push(['Tasa de fallo', Math.round(node.failure_rate_pct*100)+'%'])
  if (node.success_rate != null) meta.push(['Éxito skill', Math.round(node.success_rate*100)+'%'])
  if (node.use_count   != null) meta.push(['Usos', node.use_count])
  document.getElementById('dmeta').innerHTML = meta.map(([k,v])=>
    `<div class="drow"><span>${k}</span><span>${v}</span></div>`).join('')

  const out = gFiltered.links.filter(l => (l.source?.id||l.source)===node.id)
  const inc = gFiltered.links.filter(l => (l.target?.id||l.target)===node.id)
  const all = [
    ...out.map(l=>({d:'→',lbl:l.relation,o:(l.target?.id||l.target)})),
    ...inc.map(l=>({d:'←',lbl:l.relation,o:(l.source?.id||l.source)}))
  ].slice(0,16)
  document.getElementById('drels').innerHTML = all.length
    ? `<h4>Relaciones (${out.length+inc.length})</h4>` + all.map(r=>
        `<div class="ritem"><span style="color:#3a5a70;font-size:10px">${r.d}</span>
         <span class="rlabel">${r.lbl}</span><span class="rtarget">${r.o}</span></div>`).join('')
    : '<h4>Relaciones</h4><div style="font-size:11px;color:#3a5060">Sin relaciones visibles</div>'

  if (Graph2) {
    Graph2.centerAt(node.x,node.y,500); Graph2.zoom(3.5,500)
  }
}
function closeD(){ document.getElementById('detail').classList.remove('show') }

// ── Minimap ───────────────────────────────────────────────────────────────────
let _mmRaf = null
function startMinimap(){ if(_mmRaf) cancelAnimationFrame(_mmRaf); drawMinimap() }

function liveNodes() {
  const gn = Graph2 ? (Graph2.graphData().nodes||[]) : []
  const withPos = gn.filter(n=>n.x!=null)
  return withPos.length ? withPos : gFiltered.nodes.filter(n=>n.x!=null)
}
function bounds() {
  const ns = liveNodes(); if(!ns.length) return null
  let a=1e9,b=-1e9,c=1e9,d=-1e9
  ns.forEach(n=>{ if(n.x<a)a=n.x; if(n.x>b)b=n.x; if((n.y)<c)c=n.y; if((n.y)>d)d=n.y })
  return {minX:a,maxX:b,minY:c,maxY:d,rx:(b-a)||1,ry:(d-c)||1,nodes:ns}
}
function drawMinimap() {
  const cv = document.getElementById('minimap-canvas'); if(!cv){return}
  const ctx = cv.getContext('2d'), W=cv.width, H=cv.height, PAD=14
  ctx.clearRect(0,0,W,H)
  const bb = bounds(); if(!bb){ _mmRaf=requestAnimationFrame(drawMinimap); return }
  const mx = x => PAD+(x-bb.minX)/bb.rx*(W-PAD*2)
  const my = y => PAD+(y-bb.minY)/bb.ry*(H-PAD*2)

  ctx.lineWidth=0.5
  gFiltered.links.forEach(l=>{
    const s=l.source, t=l.target
    if(!s||!t||s.x==null||t.x==null) return
    ctx.beginPath(); ctx.strokeStyle=`rgba(100,150,255,0.15)`
    ctx.moveTo(mx(s.x),my(s.y)); ctx.lineTo(mx(t.x),my(t.y)); ctx.stroke()
  })
  bb.nodes.forEach(n=>{
    const rr = n.type==='project'?5 : n.type==='module'?3 : 1.5
    ctx.beginPath(); ctx.arc(mx(n.x),my(n.y),rr,0,2*Math.PI)
    ctx.fillStyle = COLORS[n.type]||COLORS.generic; ctx.fill()
    if(n.type==='project'){
      ctx.font='bold 8px Segoe UI'; ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.textAlign='center'
      ctx.fillText(n.name||n.id, mx(n.x), my(n.y)+rr+7)
    }
  })
  _mmRaf=requestAnimationFrame(drawMinimap)
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('minimap').addEventListener('click', e=>{
    const rect=e.currentTarget.getBoundingClientRect()
    const nx=(e.clientX-rect.left)/rect.width, ny=(e.clientY-rect.top)/rect.height
    const PAD=14, W=220, H=160
    const bb=bounds(); if(!bb) return
    const cx=bb.minX+((nx*W-PAD)/(W-PAD*2))*bb.rx
    const cy=bb.minY+((ny*H-PAD)/(H-PAD*2))*bb.ry
    if(Graph2){ Graph2.centerAt(cx,cy,500); Graph2.zoom(3,500) }
  })
})

;(function keepAlive(now){
  if (activeTab==='2d' && Graph2 && typeof Graph2.refresh==='function') {
    Graph2.refresh()   // mantiene vivos los rings animados de skills (si la versión lo soporta)
  }
  requestAnimationFrame(keepAlive)
})(0)

// ── Tooltips de leyenda ───────────────────────────────────────────────────────
const LEGEND_DESC = {
  project:{t:'⚪ Proyecto',d:'Proyecto Salesforce (CMIV2, SOLO). Nodo raíz del que cuelgan todos los módulos. Cada uno tiene su org y su canal de Slack.'},
  module:{t:'🔵 Módulo',d:'Área funcional: Oportunidades, Gestión de Visitas, App Offline, etc. El <b>color y ring pulsante</b> indican la tasa de fallo histórica:<br>🔴 alto (≥50%) · 🟡 medio · 🟢 bajo · 🔵 sin datos.'},
  generic:{t:'⚫ Submódulo',d:'Funcionalidad concreta dentro de un módulo. Ej: "Backoffice - Tareas del cliente", "Visit Template". Agrupan los casos de prueba.'},
  bug:{t:'🔴 Bug conocido',d:'Fallo concreto que el agente encontró y documentó. Cuelga del módulo donde ocurrió. Lo recuerda para detectar regresiones.'},
  skill:{t:'✦ Skill aprendido',d:'Procedimiento que el agente aprendió (ej: "verificar Dynamic Forms antes de marcar campo ausente"). Se aplica solo al inicio de cada run. El <b>ring magenta rotante</b> lo distingue.'}
}
function showLegendTip(e,type){
  const tip=document.getElementById('legend-tooltip'), d=LEGEND_DESC[type]; if(!d) return
  tip.innerHTML=`<strong style="color:#e8f0ff;font-size:13px;display:block;margin-bottom:6px">${d.t}</strong><span style="color:#8aabcc">${d.d}</span>`
  tip.style.display='block'; tip.style.visibility='hidden'
  const h=tip.offsetHeight, w=tip.offsetWidth
  const lb=document.getElementById('legend').getBoundingClientRect()
  const ir=e.currentTarget.getBoundingClientRect()
  let x=lb.right+14; if(x+w>window.innerWidth-10) x=Math.max(10, lb.left-w-14)
  let y=ir.bottom-h; if(y<10) y=10; if(y+h>window.innerHeight-10) y=window.innerHeight-h-10
  tip.style.left=x+'px'; tip.style.top=y+'px'; tip.style.visibility='visible'
}
function hideLegendTip(){ document.getElementById('legend-tooltip').style.display='none' }

// ── Carga de datos: backend API → JSON estático → DEMO ────────────────────────
function banner(text, ok){
  const tag=document.getElementById('demo-tag')
  if(ok){ tag.style.background='rgba(255,193,7,0.1)'; tag.style.border='1px solid rgba(255,193,7,0.4)'; tag.style.color='#ffe082' }
  tag.textContent=text
}
async function tryFetch(url, ms){
  const ctrl=new AbortController(); const id=setTimeout(()=>ctrl.abort(), ms)
  try{ const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(id); if(!r.ok) throw 0; return await r.json() }
  finally{ clearTimeout(id) }
}
function fillProjects(list){
  const sel=document.getElementById('project-filter')
  list.filter(p=>p&&p!=='GLOBAL').sort().forEach(p=>{
    const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o)
  })
}
async function boot(){
  let data=null, live=false
  // 1. Backend FastAPI (BigQuery en vivo) — timeout amplio: la 1ª query es fría
  try{ const d=await tryFetch(`${BACKEND}/api/graph`,20000); if(d?.nodes?.length){ data=d; live=!d.meta?.demo } }catch(e){}
  // 2. JSON estático (snapshot) — cache-bust para tomar siempre la última versión
  if(!data){ try{ const d=await tryFetch('./cortex-data.json?t='+Date.now(),3000); if(d?.nodes?.length) data=d }catch(e){} }

  if(data){
    gData=data
    const n=data.nodes.length
    banner(live?`✓ BigQuery en vivo · ${n} entidades`:`✓ Snapshot BigQuery · ${n} entidades`, true)
    if(live){ try{ fillProjects(await tryFetch(`${BACKEND}/api/projects`,3000)) }catch(e){} }
    else { fillProjects([...new Set(data.nodes.map(x=>x.project))]) }
  } else {
    fillProjects([...new Set(DEMO.nodes.map(x=>x.project))])
  }
  render()
  const gl=document.getElementById('graph-loading'); if(gl) gl.style.display='none'   // cargó -> sacar spinner del cerebro
}
boot()
</script>
