<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex — QA Agent Brain</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060c1a; color: #c8d8f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }
    #graph-3d, #graph-2d { position: absolute; inset: 0; }
    #graph-2d { display: none; }

    .tabs {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(100,150,255,0.15);
      border-radius: 8px; padding: 3px;
    }
    .tab {
      padding: 4px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; background: none;
      color: #4a6a90; transition: all 0.18s; letter-spacing: 0.5px;
    }
    .tab.active { background: rgba(79,195,247,0.18); color: #4fc3f7; }
    .tab:hover:not(.active) { color: #7aaac8; }

    #topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(6,12,26,0.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(100,150,255,0.15);
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100;
    }
    #brain-title { font-size: 17px; font-weight: 700; letter-spacing: 1px; color: #a0c4ff; white-space: nowrap; }
    #brain-title span { color: #4fc3f7; }

    .chip {
      display: flex; align-items: center; gap: 6px;
      background: rgba(79,195,247,0.07); border: 1px solid rgba(79,195,247,0.18);
      border-radius: 20px; padding: 4px 13px; font-size: 12px; color: #7a9ab8; white-space: nowrap;
    }
    .chip strong { color: #dceeff; font-size: 13px; }
    .chip.green { border-color: rgba(102,187,106,0.35); background: rgba(102,187,106,0.07); }
    .chip.green strong { color: #a5d6a7; }

    #demo-tag {
      margin-left: auto; font-size: 11px; color: #ffa040;
      background: rgba(255,160,64,0.1); border: 1px solid rgba(255,160,64,0.3);
      border-radius: 12px; padding: 3px 12px;
    }

    #legend {
      position: absolute; bottom: 24px; left: 18px;
      background: rgba(6,12,26,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(100,150,255,0.1); border-radius: 10px;
      padding: 14px 16px; z-index: 100; min-width: 155px;
    }
    #legend h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #3a5060; margin-bottom: 10px; }
    .li { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: #6080a0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 5px currentColor; }

    #detail {
      position: absolute; top: 68px; right: 18px; width: 270px;
      background: rgba(6,12,26,0.92); backdrop-filter: blur(14px);
      border: 1px solid rgba(100,150,255,0.13); border-radius: 10px;
      padding: 16px; z-index: 100; display: none;
      max-height: calc(100vh - 110px); overflow-y: auto;
    }
    #detail.show { display: block; }
    #detail h3 { font-size: 13px; color: #c8d8f0; margin-bottom: 3px; word-break: break-all; }
    #dtype { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .drow { display: flex; justify-content: space-between; font-size: 11px; color: #607888;
            padding: 4px 0; border-bottom: 1px solid rgba(100,150,255,0.06); }
    .drow span:last-child { color: #90b0c8; }
    #drels { margin-top: 12px; }
    #drels h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #3a5060; margin-bottom: 8px; }
    .ritem { font-size: 11px; display: flex; gap: 6px; align-items: baseline; padding: 3px 0; }
    .rlabel { color: #4a6880; font-size: 10px; background: rgba(79,195,247,0.07); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
    .rtarget { color: #80a8c8; word-break: break-all; }
    #dclose { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #4a6070; font-size: 16px; cursor: pointer; }
    #dclose:hover { color: #90b0c8; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.2); border-radius: 2px; }

    /* ── Minimap ─────────────────────────────────────────────────────────── */
    #minimap {
      position: absolute; bottom: 80px; right: 18px; z-index: 100;
      width: 220px; height: 160px;
      background: rgba(4,9,20,0.88); backdrop-filter: blur(8px);
      border: 1px solid rgba(100,150,255,0.18); border-radius: 10px;
      cursor: crosshair; overflow: hidden;
    }
    #minimap:hover { border-color: rgba(100,150,255,0.40); }
    #minimap-canvas { display: block; width: 220px; height: 160px; }
    #minimap-label {
      position: absolute; top: 5px; left: 9px;
      font-size: 8px; letter-spacing: 1.2px; color: rgba(100,150,200,0.5);
      pointer-events: none; user-select: none;
    }
    #minimap-viewport {
      position: absolute; border: 1px solid rgba(79,195,247,0.6);
      background: rgba(79,195,247,0.07); pointer-events: none; border-radius: 2px;
    }
  </style>
</head>
<body>
<div id="graph-3d"></div>
<div id="graph-2d"></div>

<div id="topbar">
  <div id="brain-title">🧠 <span>Cortex</span></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('3d')">3D</button>
    <button class="tab"        onclick="switchTab('2d')">2D</button>
  </div>
  <div class="chip"><strong id="sn">—</strong>&nbsp;entidades</div>
  <div class="chip"><strong id="sl">—</strong>&nbsp;relaciones</div>
  <div class="chip green"><strong id="ss">—</strong>&nbsp;skills</div>

  <!-- Filtro de proyecto -->

    <span style="font-size:11px;color:#4a6a90;white-space:nowrap">Proyecto:</span>
    <select id="project-filter" onchange="render()"
      style="background:rgba(171,71,188,0.1);border:1px solid rgba(171,71,188,0.3);
             border-radius:6px;color:#e0c8f0;font-size:11px;padding:3px 8px;cursor:pointer;">
      <option value="ALL">Todos</option>

  <div style="display:flex;align-items:center;gap:6px;">

    <select id="view-preset" onchange="render()"
      style="background:rgba(79,195,247,0.08);border:1px solid rgba(79,195,247,0.2);
             border-radius:6px;color:#c8d8f0;font-size:11px;padding:3px 8px;cursor:pointer;">
      <option value="proyectos">⚪ Proyectos</option>
      <option value="estructura">🏗 Estructura</option>

      <option value="bugs">🐛 Bugs abiertos</option>
      <option value="issues">🎫 Issues + módulos</option>

  </div>

  <!-- Toggle labels -->
  <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:#4a6a90;cursor:pointer;white-space:nowrap;">
    <input type="checkbox" id="labels-toggle" onchange="render()" style="cursor:pointer;">
    Etiquetas
  </label>

  <div id="demo-tag">⚠ Demo — ejecutá el agente para datos reales</div>
</div>

<div id="legend">
  <h4>Tipos de nodo</h4>
  <div class="li"><div class="dot" style="background:#ffffff;color:#fff"></div>Proyecto</div>
  <div class="li"><div class="dot" style="background:#4fc3f7;color:#4fc3f7"></div>Campo SF</div>
  <div class="li"><div class="dot" style="background:#ab47bc;color:#ab47bc"></div>Perfil / Usuario</div>
  <div class="li"><div class="dot" style="background:#66bb6a;color:#66bb6a"></div>Skill aprendido</div>
  <div class="li"><div class="dot" style="background:#ff7043;color:#ff7043"></div>Root cause</div>
  <div class="li"><div class="dot" style="background:#ec407a;color:#ec407a"></div>Condición / Flow</div>
  <div class="li"><div class="dot" style="background:#ffa726;color:#ffa726"></div>Test Case</div>
  <div class="li"><div class="dot" style="background:#607d8b;color:#607d8b"></div>Genérico</div>
</div>

<!-- ── Minimap ───────────────────────────────────────────────────────────── -->
<div id="minimap">
  <canvas id="minimap-canvas" width="220" height="160"></canvas>
  <div id="minimap-label">MAPA GENERAL</div>
</div>

<div id="detail">
  <button id="dclose" onclick="closeD()">✕</button>
  <h3 id="dname"></h3>
  <div id="dtype"></div>
  <div id="dmeta"></div>
  <div id="drels"></div>
</div>

<script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
<script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script>

// ── Demo data — reemplazado por BigQuery cuando el agente ejecuta runs reales ──
const DEMO = {

    {id:"skill:fls-diag",    name:"FLS Diagnosis",         type:"skill",      val:4,  is_new:false, success_rate:0.88, use_count:4},
    {id:"skill:val-rule",    name:"Validation Rule Bypass", type:"skill",     val:3,  is_new:false, success_rate:0.80, use_count:2},
    {id:"dynamic_forms",     name:"dynamic_forms",         type:"condition",  val:8,  is_new:false},
    {id:"fls_restriction",   name:"fls_restriction",       type:"root_cause", val:7,  is_new:false},
    {id:"apex_trigger_block",name:"apex_trigger_block",    type:"root_cause", val:5,  is_new:false},
    {id:"validation_rule",   name:"validation_rule",       type:"root_cause", val:5,  is_new:false},
    {id:"TC-0047",           name:"TC-0047",               type:"test_case",  val:3,  is_new:false},
    {id:"TC-0023",           name:"TC-0023",               type:"test_case",  val:3,  is_new:false},
    {id:"TC-0061",           name:"TC-0061",               type:"test_case",  val:2,  is_new:true},
    {id:"Contact_Page",      name:"Contact Record Page",   type:"sf_field",   val:4,  is_new:false},
    {id:"Partner_Account",   name:"Account.Type=Partner",  type:"condition",  val:4,  is_new:false},
    {id:"Opp_Stage_Flow",    name:"Stage Change Flow",     type:"flow",       val:4,  is_new:true},
    {id:"Sprint_24",         name:"Sprint 24",             type:"generic",    val:3,  is_new:false},
  ],
  links: [
    {source:"Contact.Email__c",  target:"Sales_User",         relation:"hidden_when",      value:0.95},
    {source:"Contact.Email__c",  target:"fls_restriction",    relation:"blocked_by",       value:0.92},
    {source:"Contact.Phone__c",  target:"Sales_User",         relation:"readonly_when",    value:0.80},
    {source:"Contact_Page",      target:"dynamic_forms",      relation:"uses",             value:0.90},
    {source:"dynamic_forms",     target:"Account.Type",       relation:"depends_on",       value:0.85},
    {source:"Account.Type",      target:"Partner_Account",    relation:"triggers_flow",    value:0.78},
    {source:"TC-0047",           target:"Contact.Email__c",   relation:"tests",            value:1.00},
    {source:"TC-0047",           target:"fls_restriction",    relation:"failed_because",   value:0.95},
    {source:"TC-0023",           target:"Account.Type",       relation:"tests",            value:1.00},
    {source:"TC-0061",           target:"Opportunity.Stage",  relation:"tests",            value:1.00},
    {source:"TC-0061",           target:"Opp_Stage_Flow",     relation:"failed_because",   value:0.88},
    {source:"Opportunity.Stage", target:"Opp_Stage_Flow",     relation:"triggers_flow",    value:0.85},
    {source:"Opp_Stage_Flow",    target:"apex_trigger_block", relation:"blocked_by",       value:0.70},
    {source:"Gerente_Comercial", target:"Opportunity.Stage",  relation:"can_edit",         value:0.95},
    {source:"Sales_User",        target:"Opportunity.Stage",  relation:"restricted_to",    value:0.75},
    {source:"skill:dyn-forms",   target:"dynamic_forms",      relation:"covers",           value:0.90},
    {source:"skill:dyn-forms",   target:"fls_restriction",    relation:"covers",           value:0.75},
    {source:"skill:fls-diag",    target:"fls_restriction",    relation:"covers",           value:0.95},
    {source:"skill:fls-diag",    target:"validation_rule",    relation:"covers",           value:0.65},
    {source:"skill:val-rule",    target:"validation_rule",    relation:"covers",           value:0.90},
    {source:"validation_rule",   target:"Contact.Email__c",   relation:"blocked_by",       value:0.65},
    {source:"TC-0047",           target:"Sprint_24",          relation:"fixed_in",         value:0.80},
    {source:"CMIV2",             target:"Contact.Email__c",   relation:"contains",         value:0.50},
    {source:"CMIV2",             target:"Sales_User",         relation:"contains",         value:0.50},
    {source:"CMIV2",             target:"Gerente_Comercial",  relation:"contains",         value:0.50},
    {source:"SOLO",              target:"Opportunity.Stage",  relation:"contains",         value:0.50},
    {source:"SOLO",              target:"Opp_Stage_Flow",     relation:"contains",         value:0.50},
  ]
}

// ── Colores por tipo ──────────────────────────────────────────────────────────
const COLORS = {
  project:'#ffffff', sf_field:'#4fc3f7', sf_profile:'#ab47bc',
  skill:'#66bb6a', root_cause:'#ff7043', condition:'#ec407a',
  flow:'#29b6f6', test_case:'#ffa726', generic:'#607d8b'
}
const TYPE_LABEL = {
  project:'Proyecto', sf_field:'Campo Salesforce', sf_profile:'Perfil / Usuario',
  skill:'Skill aprendido', root_cause:'Root Cause', condition:'Condición / Dynamic Forms',
  flow:'Flow / Trigger', test_case:'Test Case', generic:'Entidad'
}

let gData     = DEMO
let gFiltered = DEMO   // vista filtrada activa
let Graph3    = null
let Graph2    = null
let activeTab = '3d'

// ── Presets de filtro ─────────────────────────────────────────────────────────
const PRESETS = {
  proyectos:  [],  // solo nodos tipo project, sin links
  estructura: ['contains_module', 'has_submodule'],
  salud:      ['contains_module', 'has_submodule', 'failure_rate', 'has_failed_tc_count'],
  bugs:       ['contains_module', 'has_submodule', 'has_open_bug',
               'unexpected_edit_access', 'unexpected_access', 'not_visible_for',
               'incorrectly_visible', 'not_configured_in', 'missing_picklist_value',
               'shows_wrong_value', 'not_auto_removed_on', 'incorrect_flow_for',
               'not_working_in', 'picklist_restricted_for'],
  issues:     ['contains_module', 'tested_in_module', 'failure_rate'],
  todo:       null   // null = mostrar todo
}

// ── Filtrado combinado: vista (relaciones) + proyecto ───────────────────────
function computeFiltered() {
  const preset  = document.getElementById('view-preset')?.value || 'proyectos'
  // Sincronizar el dropdown con el default
  const sel = document.getElementById('view-preset')
  if (sel && !sel.dataset.initialized) { sel.value = 'proyectos'; sel.dataset.initialized = '1' }
  const proj    = document.getElementById('project-filter')?.value || 'ALL'
  const relations = PRESETS[preset]

  // Preset especial: solo proyectos, sin links
  if (Array.isArray(relations) && relations.length === 0) {
    let nodes = gData.nodes.filter(n => n.type === 'project')
    if (proj !== 'ALL') nodes = nodes.filter(n => n.project === proj || n.id === proj)
    return { nodes, links: [], meta: gData.meta }
  }

  // 1. Filtrar links por relación
  let links = relations
    ? gData.links.filter(l => new Set(relations).has(l.relation))
    : gData.links.slice()

  // 2. Filtrar por proyecto (si no es ALL)
  if (proj !== 'ALL') {
    const projNodeIds = new Set(gData.nodes.filter(n => n.project === proj).map(n => n.id))
    links = links.filter(l => {
      const s = l.source?.id || l.source, t = l.target?.id || l.target
      return projNodeIds.has(s) || projNodeIds.has(t)
    })
  }

  // 3. Nodos que participan en esos links
  const nodeIds = new Set()
  links.forEach(l => { nodeIds.add(l.source?.id || l.source); nodeIds.add(l.target?.id || l.target) })
  let nodes = gData.nodes.filter(n => nodeIds.has(n.id))
  if (proj !== 'ALL') nodes = nodes.filter(n => n.project === proj || n.type === 'project')

  return { nodes, links, meta: gData.meta }
}

// ── Render: recalcula filtro y redibuja el grafo activo ─────────────────────
function render() {
  gFiltered = computeFiltered()
  const labelsOn = document.getElementById('labels-toggle')?.checked

  if (activeTab === '3d') {
    if (!Graph3) { initGraph3D(); return }  // initGraph3D ya carga los datos
    Graph3.graphData({ nodes: gFiltered.nodes, links: gFiltered.links.map(l => ({...l})) })
    // zoomToFit lo maneja onEngineStop, pero forzamos uno por si el motor ya estaba quieto
    setTimeout(() => Graph3.zoomToFit(800, 60), 3000)
  } else {
    if (!Graph2) initGraph2D()
    Graph2.nodeCanvasObjectMode(() => 'replace')
    Graph2.graphData({ nodes: gFiltered.nodes, links: gFiltered.links.map(l => ({...l})) })
    setTimeout(() => Graph2.zoomToFit(700, 60), 1800)
  }
  updateStats()
  startMinimap()   // arrancar/reiniciar el minimap
}

function updateStats() {
  document.getElementById('sn').textContent = gFiltered.nodes.length
  document.getElementById('sl').textContent = gFiltered.links.length
  document.getElementById('ss').textContent = gFiltered.nodes.filter(n => n.type === 'skill').length
}

// ── Poblar dropdown de proyectos desde los datos ────────────────────────────
function populateProjects() {
  const projects = [...new Set(gData.nodes.map(n => n.project).filter(Boolean))].sort()
  const sel = document.getElementById('project-filter')
  projects.forEach(p => {
    if (p === 'GLOBAL') return
    const opt = document.createElement('option')
    opt.value = p; opt.textContent = p
    sel.appendChild(opt)
  })
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab
  document.getElementById('graph-3d').style.display = tab === '3d' ? 'block' : 'none'
  document.getElementById('graph-2d').style.display = tab === '2d' ? 'block' : 'none'
  document.querySelectorAll('.tab').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === '3d') || (i === 1 && tab === '2d'))
  })
  closeD()
  render()
}

// ── Init 3D graph ─────────────────────────────────────────────────────────────
function initGraph3D() {
  Graph3 = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('graph-3d'))
    .backgroundColor('#060c1a')
    .showNavInfo(false)
    .nodeLabel(n => n.name || n.id)
    .nodeVal(n => n.type === 'project' ? 80 : Math.max(1, n.val || 1))
    .nodeColor(n => COLORS[n.type] || COLORS.generic)
    .nodeOpacity(0.9)
    .nodeResolution(16)
    .linkColor(l => `rgba(100,160,255,${Math.max(0.12, (l.value||0.5)*0.5)})`)
    .linkWidth(l => Math.max(0.3, (l.value||0.5) * 1.2))
    .linkDirectionalParticles(l => l.value > 0.85 ? 2 : 0)
    .linkDirectionalParticleWidth(1.2)
    .linkDirectionalParticleColor(() => 'rgba(79,195,247,0.9)')
    .linkLabel(l => l.relation || '')
    .onNodeClick(showDetail)
    .onBackgroundClick(closeD)

  Graph3.d3Force('charge').strength(-180).distanceMax(600)
  Graph3.d3Force('link').distance(l => {
    if (l.relation === 'has_open_bug')     return 100
    if (l.relation === 'has_submodule')    return 70
    if (l.relation === 'tested_in_module') return 60
    return 50
  })
  Graph3.d3AlphaDecay(0.02)
  Graph3.d3VelocityDecay(0.4)
  // Sin warmupTicks — dejar que anime desde el inicio para que la cámara vea los nodos
  Graph3.cooldownTime(8000)
  // zoomToFit cuando el motor se detiene (nodos ya posicionados)
  Graph3.onEngineStop(() => Graph3.zoomToFit(800, 60))
  Graph3.graphData({ nodes: gFiltered.nodes, links: gFiltered.links.map(l => ({...l})) })
  updateStats()
}

// ── Init 2D graph ─────────────────────────────────────────────────────────────
function initGraph2D() {
  Graph2 = ForceGraph()(document.getElementById('graph-2d'))
    .backgroundColor('#060c1a')
    .nodeLabel(n => n.name || n.id)
    .nodeVal(n => n.type === 'project' ? 80 : Math.max(1, n.val || 1))
    .nodeColor(n => COLORS[n.type] || COLORS.generic)
    .nodeCanvasObject((node, ctx, scale) => {
      const isProject = node.type === 'project'
      const r     = isProject ? 28 : Math.sqrt(Math.max(1, node.val || 1)) * 3
      const color = COLORS[node.type] || COLORS.generic

      // glow (más grande para proyectos)
      ctx.beginPath()
      ctx.arc(node.x, node.y, r + (isProject ? 10 : 3), 0, 2 * Math.PI)
      ctx.fillStyle = isProject ? 'rgba(255,255,255,0.12)' : (color + '28')
      ctx.fill()

      // node circle
      ctx.beginPath()
      ctx.arc(node.x, node.y, r, 0, 2 * Math.PI)
      ctx.fillStyle = color
      ctx.fill()

      // ring exterior para proyectos
      if (isProject) {
        ctx.beginPath()
        ctx.arc(node.x, node.y, r + 3, 0, 2 * Math.PI)
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'
        ctx.lineWidth = 1.5
        ctx.stroke()
      }

      // label: solo si el toggle "Etiquetas" está activo.
      // Sin toggle: solo proyectos (siempre) y nodos grandes al hacer zoom.
      const labelsOn  = document.getElementById('labels-toggle')?.checked
      const showLabel = isProject                           // proyectos: siempre
                     || (labelsOn && scale >= 1.0)          // toggle on: todos
                     || (!labelsOn && scale >= 3 && (node.val||1) >= 5) // zoom fuerte
      if (showLabel) {
        const raw      = node.name || node.id
        const label    = raw.length > 28 ? raw.substring(0, 26) + '…' : raw
        const fontSize = Math.max(6, 10 / scale)
        ctx.font      = `${fontSize}px Segoe UI, system-ui, sans-serif`
        ctx.textAlign = 'center'
        ctx.textBaseline = 'top'
        ctx.fillStyle = node.type === 'project' ? 'rgba(255,255,255,0.95)' : 'rgba(170,200,235,0.8)'
        ctx.fillText(label, node.x, node.y + r + 2)
      }
    })
    .nodeCanvasObjectMode(() => 'replace')
    .linkColor(l => `rgba(100,160,255,${Math.max(0.1, (l.value||0.5)*0.45)})`)
    .linkWidth(l => Math.max(0.5, (l.value||0.5) * 1.5))
    .linkDirectionalParticles(l => l.value > 0.85 ? 3 : 0)
    .linkDirectionalParticleWidth(2)
    .linkDirectionalParticleColor(() => 'rgba(79,195,247,0.95)')
    .linkLabel(l => l.relation || '')
    .onNodeClick(showDetail)
    .onBackgroundClick(closeD)

  Graph2.d3Force('charge').strength(-700).distanceMax(1000)
  Graph2.d3Force('link').distance(l => {
    if (l.relation === 'has_open_bug')     return 180
    if (l.relation === 'has_submodule')    return 130
    if (l.relation === 'tested_in_module') return 110
    return 90
  })
  Graph2.d3AlphaDecay(0.008)
  Graph2.d3VelocityDecay(0.25)
  Graph2.warmupTicks(200)
  Graph2.cooldownTime(8000)
  Graph2.graphData({ nodes: gFiltered.nodes, links: gFiltered.links.map(l => ({...l})) })
  setTimeout(() => Graph2.zoomToFit(600, 40), 2000)
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function showDetail(node) {
  const p = document.getElementById('detail')
  p.classList.add('show')
  document.getElementById('dname').textContent = node.name || node.id

  const te = document.getElementById('dtype')
  te.textContent = TYPE_LABEL[node.type] || node.type
  te.style.color = COLORS[node.type] || COLORS.generic

  const meta = []
  if (node.type)         meta.push(['Tipo', TYPE_LABEL[node.type] || node.type])
  if (node.val)          meta.push(['Conexiones', node.val])
  if (node.success_rate) meta.push(['Éxito skill', Math.round(node.success_rate*100)+'%'])
  if (node.use_count)    meta.push(['Usos', node.use_count])
  if (node.is_new)       meta.push(['', '🟢 Nuevo — últimas 24h'])
  document.getElementById('dmeta').innerHTML = meta.map(([k,v]) =>
    `<div class="drow"><span>${k}</span><span>${v}</span></div>`).join('')

  const out = gData.links.filter(l => (l.source?.id||l.source) === node.id)
  const inc = gData.links.filter(l => (l.target?.id||l.target) === node.id)
  const all = [
    ...out.map(l => ({dir:'→', label:l.relation, other: l.target?.id||l.target, v:l.value})),
    ...inc.map(l => ({dir:'←', label:l.relation, other: l.source?.id||l.source, v:l.value}))
  ].slice(0, 14)

  document.getElementById('drels').innerHTML = all.length
    ? `<h4>Relaciones (${out.length+inc.length})</h4>`
      + all.map(r => `<div class="ritem">
          <span style="color:#3a5a70;font-size:10px">${r.dir}</span>
          <span class="rlabel">${r.label}</span>
          <span class="rtarget">${r.other}</span>
        </div>`).join('')
      + (out.length+inc.length > 14 ? `<div style="font-size:10px;color:#3a5060;margin-top:6px">y ${out.length+inc.length-14} más...</div>` : '')
    : '<h4>Relaciones</h4><div style="font-size:11px;color:#3a5060;margin-top:4px">Sin relaciones visibles</div>'

  if (activeTab === '3d' && Graph3) {
    const d = 120, r = 1 + d / Math.hypot(node.x||1, node.y||1, node.z||1)
    Graph3.cameraPosition({x:(node.x||0)*r, y:(node.y||0)*r, z:(node.z||0)*r}, node, 700)
  } else if (activeTab === '2d' && Graph2) {
    Graph2.centerAt(node.x, node.y, 500)
    Graph2.zoom(4, 500)
  }
}

function closeD() { document.getElementById('detail').classList.remove('show') }

// ── Minimap ───────────────────────────────────────────────────────────────────
let _mmRaf = null

function startMinimap() {
  if (_mmRaf) cancelAnimationFrame(_mmRaf)
  drawMinimap()
}

function drawMinimap() {
  const canvas = document.getElementById('minimap-canvas')
  if (!canvas) return
  const ctx = canvas.getContext('2d')
  const W = canvas.width, H = canvas.height
  const PAD = 14

  ctx.clearRect(0, 0, W, H)

  // Obtener nodos con posición ya calculada por la simulación
  const nodes = gFiltered.nodes.filter(n => n.x != null)
  if (!nodes.length) { _mmRaf = requestAnimationFrame(drawMinimap); return }

  // Bounding box del grafo completo
  // Usar getGraphBounds() para consistencia con el click handler
  const bounds = getGraphBounds()
  if (!bounds) { _mmRaf = requestAnimationFrame(drawMinimap); return }
  const { minX, minY, rangeX, rangeY } = bounds

  // Proyección: coordenada grafo → píxel minimap
  const toMX = x => PAD + (x - minX) / rangeX * (W - PAD*2)
  const toMY = y => PAD + (y - minY) / rangeY * (H - PAD*2)

  // Links
  ctx.lineWidth = 0.6
  gFiltered.links.forEach(l => {
    const s = l.source?.x != null ? l.source : null
    const t = l.target?.x != null ? l.target : null
    if (!s || !t) return
    const sy = s.y || 0
    const ty = t.y || 0
    ctx.beginPath()
    ctx.strokeStyle = `rgba(100,150,255,${Math.max(0.08, (l.value||0.5)*0.25)})`
    ctx.moveTo(toMX(s.x), toMY(sy))
    ctx.lineTo(toMX(t.x), toMY(ty))
    ctx.stroke()
  })

  // Nodos
  nodes.forEach(n => {
    const ny = n.y || 0
    const mx = toMX(n.x), my = toMY(ny)
    const r = n.type === 'project' ? 5 : Math.min(3, Math.sqrt(n.val||1))
    ctx.beginPath()
    ctx.arc(mx, my, r, 0, 2*Math.PI)
    ctx.fillStyle = COLORS[n.type] || COLORS.generic
    ctx.fill()
    // Label solo para proyectos en el minimap
    if (n.type === 'project') {
      ctx.font = 'bold 8px Segoe UI, sans-serif'
      ctx.fillStyle = 'rgba(255,255,255,0.8)'
      ctx.textAlign = 'center'
      ctx.fillText(n.name || n.id, mx, my + r + 7)
    }
  })

  // Rectángulo de viewport (solo 2D — podemos leer zoom y center)
  if (activeTab === '2d' && Graph2) {
    try {
      const zoom   = Graph2.zoom()
      const center = Graph2.centerAt()  // {x, y}
      if (center && zoom) {
        const cont = document.getElementById('graph-2d')
        const vpW  = cont.clientWidth  / zoom
        const vpH  = cont.clientHeight / zoom
        const vx1  = toMX(center.x - vpW/2), vy1 = toMY(center.y - vpH/2)
        const vx2  = toMX(center.x + vpW/2), vy2 = toMY(center.y + vpH/2)
        ctx.strokeStyle = 'rgba(79,195,247,0.7)'
        ctx.lineWidth = 1
        ctx.setLineDash([3,2])
        ctx.strokeRect(vx1, vy1, vx2-vx1, vy2-vy1)
        ctx.fillStyle = 'rgba(79,195,247,0.06)'
        ctx.fillRect(vx1, vy1, vx2-vx1, vy2-vy1)
        ctx.setLineDash([])
      }
    } catch(e) { /* zoom/center no disponible aún */ }
  }

  _mmRaf = requestAnimationFrame(drawMinimap)
}

// ── Helpers compartidos minimap: bounding box y proyección ───────────────────
function getGraphBounds() {
  const nodes = gFiltered.nodes.filter(n => n.x != null)
  if (!nodes.length) return null
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity
  nodes.forEach(n => {
    // En 3D usamos x/y (vista frontal), igual que en drawMinimap
    const gy = activeTab === '3d' ? (n.y||0) : (n.y||0)
    if (n.x < minX) minX = n.x;  if (n.x > maxX) maxX = n.x
    if (gy < minY)  minY = gy;   if (gy > maxY)  maxY = gy
  })
  return { minX, maxX, minY, maxY,
    rangeX: maxX - minX || 1,
    rangeY: maxY - minY || 1 }
}

// Click en el minimap → navegar a esa zona
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('minimap').addEventListener('click', e => {
    const rect  = e.currentTarget.getBoundingClientRect()
    const normX = (e.clientX - rect.left)  / rect.width
    const normY = (e.clientY - rect.top)   / rect.height
    const PAD   = 14, W = 220, H = 160

    const bounds = getGraphBounds()
    if (!bounds) return

    // Convertir click normalizado → coordenada en espacio del grafo
    const clickX = bounds.minX + ((normX * W - PAD) / (W - PAD*2)) * bounds.rangeX
    const clickY = bounds.minY + ((normY * H - PAD) / (H - PAD*2)) * bounds.rangeY

    if (activeTab === '2d' && Graph2) {
      // 2D: centrar en ese punto y hacer zoom para ver bien el área
      const zoomLevel = Math.max(2, Math.min(6, 400 / Math.max(bounds.rangeX, bounds.rangeY) * 10))
      Graph2.centerAt(clickX, clickY, 500)
      Graph2.zoom(zoomLevel, 500)

    } else if (activeTab === '3d' && Graph3) {
      // 3D: posición cámara = punto clickeado pero con Z proporcional al rango del grafo
      // para estar lo suficientemente lejos y ver el área completa alrededor del click
      const camZ = Math.max(100, bounds.rangeX * 0.5)
      Graph3.cameraPosition(
        { x: clickX, y: clickY, z: camZ },
        { x: clickX, y: clickY, z: 0 },
        600
      )
    }
  })
})

// ── Boot — intenta cargar datos reales de BigQuery, cae en DEMO si falla ─────
async function boot() {
  try {
    const resp = await fetch('./cortex-data.json')
    if (!resp.ok) throw new Error('no data file')
    const data = await resp.json()
    if (data.nodes && data.nodes.length > 0) {
      gData = data
      // Ocultar banner de demo y mostrar banner de datos reales
      const tag = document.getElementById('demo-tag')
      tag.style.background = 'rgba(102,187,106,0.1)'
      tag.style.border = '1px solid rgba(102,187,106,0.4)'
      tag.style.color = '#a5d6a7'
      const ts = data.meta && data.meta.generated_at
        ? new Date(data.meta.generated_at).toLocaleString('es-AR', {dateStyle:'short', timeStyle:'short'})
        : ''
      tag.textContent = `✓ Datos reales BigQuery${ts ? ' · ' + ts : ''} · ${data.nodes.length} entidades`
    }
  } catch(e) {
    // Sin cortex-data.json → usar DEMO silenciosamente
  }
  populateProjects()   // llenar dropdown de proyectos
  render()             // dibuja con vista "Estructura" + proyecto "Todos"
}
boot()
